name: atmosync
version: "1.0.0"
config-version: 2
profile: atmosync

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: target
clean-targets: [target, dbt_packages]

# IMPORTANT: keep these in sync with ../config/settings.yaml (tests/test_dbt_vars_sync.py enforces it).
vars:
  base_shelf_life_days: 21
  reference_temp_c: 7.0
  q10: 2.5
  chill_floor_c: 5.0
  rh_penalty_per_10pct: 0.25
  max_gap_hours: 1.0
  recent_window_minutes: 60
  required_retail_shelf_hours: 72
  salvage_value_fraction: 0.10
  rate_cap: 4.0
  temp_min_c: 5.0
  temp_max_c: 13.0
  rh_min_pct: 85.0
  rh_max_pct: 95.0
  valid_temp_min_c: -30
  valid_temp_max_c: 60
  valid_rh_min_pct: 0
  valid_rh_max_pct: 100
  valid_vibration_max_g: 10
  w_burn: 0.25
  w_margin: 0.50
  w_excursion: 0.15
  w_consumed: 0.10
  slack_scale_hours: 72
  high_slack_hours: 24
  medium_score: 30
  avg_speed_kmph: 70
  road_factor: 1.25
  transport_usd_per_tonne_km: 0.10
  handling_usd_per_kg: 0.03
  reroute_fixed_fee_usd: 250
  min_benefit_usd: 500
  min_benefit_pct: 0.03

models:
  atmosync:
    staging:      {+materialized: view}
    intermediate: {+materialized: view}
    marts:        {+materialized: table}
