# Feature 5 - market price intelligence. Every dataset must declare its TYPE; the UI and reports always show it.
market:
  datasets:
    - {id: sample_simulated, path: data/sample/market_prices.csv, type: SIMULATED, optional: false,
       description: "Simulated wholesale USD/kg generated by scripts/generate_sample_data.py (illustrative, not market data)"}
    - {id: hab_derived, path: data/processed/market_prices_hab.csv, type: HISTORICAL_DERIVED, optional: true,
       description: "Hass Avocado Board RETAIL scan data converted to wholesale USD/kg with ingestion/hab_prices.py (assumed conversion). Create it yourself - see docs/features/05_market_intelligence.md"}
  trend_windows_days: [7, 30]
  volatility_window_days: 14
  stable_band_pct: 2.0             # |7-day change| below this => 'Stable'
  default_quantity_kg: 20000
  simulation: {seed: 11, days: 90, base_price_usd_kg: 3.5, daily_volatility: 0.03}   # used by simulate_price_series()
